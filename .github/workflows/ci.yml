name: ci

# 流水线作业名与主分支保护规则中填写的检查项名称必须逐字一致。
on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: 记录被检版本
        run: echo "COMMIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: 格式检查 gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt 存在差异："
            echo "$out"
            exit 1
          fi

      - name: 静态检查 go vet
        run: go vet ./...

      - name: 单元测试（含竞态检测）
        run: go test -race ./... -count=1

      - name: 覆盖率门禁（唯一统计口径）
        run: |
          python3 scripts/coverage_gate.py --root . --out-dir evidence --min 85

      - name: 归档覆盖率原始文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-evidence
          path: |
            evidence/coverage.out
            evidence/coverage-summary.txt

  deploy:
    name: deploy
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: 构建二进制
        run: |
          mkdir -p bin
          go build -o bin/server ./cmd/server
          go build -o bin/mockgen ./cmd/mockgen
          sha256sum bin/server bin/mockgen | tee build-artifacts.txt

      - name: 构建镜像
        run: docker build -t creative-studio:${GITHUB_SHA} .

      - name: 部署到教学验收环境
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh "${GITHUB_SHA}" 2>&1 | tee evidence/deployment-main.log

      - name: 健康检查
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${DEPLOY_TARGET}/healthz"; then
              echo "healthz ok"
              exit 0
            fi
            sleep 2
          done
          echo "健康检查失败"
          exit 1

      - name: 业务冒烟检查
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
        run: |
          python3 scripts/verify_scenarios.py --base "${DEPLOY_TARGET}" --mock "${DEPLOY_TARGET}/mock"
          echo "smoke ok"

      - name: 上线冒烟结果归档
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence
          path: |
            evidence/deployment-main.log
            evidence/scenario-verify.log
